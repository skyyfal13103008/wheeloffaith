<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Wheel of Faith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Figtree:wght@400;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  /* Layout: wheel on the left, character sheet filling in on the right; stacks on phones. Single committed dark "tarot night" look. */
  :root {
    --ink: #130f26;
    --panel: #1d1838;
    --panel-2: #26204a;
    --line: #3b335f;
    --fg: #f1ecff;
    --muted: #a99fcc;
    --gold: #eab54d;
    --gold-soft: rgba(234, 181, 77, 0.16);
    --rose: #ff6b95;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --label: "Barlow Condensed", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--ink); color: var(--fg); }
  body {
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    background:
      radial-gradient(1200px 600px at 20% -10%, #2b2160 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #3a1840 0%, transparent 55%),
      var(--ink);
    min-height: 100%;
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 28px; }

  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .eyebrow { margin: 0; font-family: var(--label); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-size: 13px; }
  h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(32px, 6vw, 52px); line-height: 1; letter-spacing: 0.02em; text-wrap: balance; }
  .top-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  label { font-family: var(--label); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
  select, input[type="text"], textarea {
    font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  textarea { width: 100%; min-height: 180px; resize: vertical; line-height: 1.6; }
  input[type="text"] { width: 100%; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid transparent; padding: 10px 20px; font-weight: 700; transition: transform .12s ease, background .15s ease, opacity .15s; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .primary { background: var(--gold); color: #2a1a00; font-family: var(--display); font-weight: 800; letter-spacing: .08em; font-size: 18px; padding: 12px 36px; box-shadow: 0 6px 24px rgba(234,181,77,.3); }
  .primary:hover:not(:disabled) { background: #f4c66a; }
  .secondary { background: var(--panel-2); color: var(--fg); border-color: var(--line); }
  .secondary:hover:not(:disabled) { border-color: var(--gold); }
  .ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .ghost:hover:not(:disabled) { color: var(--fg); }
  .link { background: none; border: none; padding: 2px 0; color: var(--gold); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; border-radius: 4px; }
  .small { padding: 4px 12px; font-size: 13px; font-weight: 600; }

  .stage { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); } }

  .wheel-col { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
  .wheel-label { margin: 0; display: flex; align-items: baseline; gap: 12px; font-family: var(--display); font-size: 22px; font-weight: 600; }
  .step { font-family: var(--label); font-size: 14px; color: var(--muted); letter-spacing: .1em; }
  .wheel-wrap { position: relative; width: min(100%, 440px); aspect-ratio: 1; max-width: 100%; }
  .wheel-wrap::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(closest-side, rgba(234,181,77,.18), transparent); z-index: 0; }
  canvas { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; z-index: 2; top: -6px; left: 50%; width: 30px; height: 40px; transform: translateX(-50%); transform-origin: 50% 20%;
    background: var(--gold); clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  .pointer.tick { animation: tick .09s ease-out; }
  @keyframes tick { 50% { transform: translateX(-50%) rotate(-14deg); } }

  .landed { margin: 0; min-height: 2.4em; text-align: center; font-family: var(--display); font-size: clamp(20px, 3.4vw, 28px); font-weight: 800; color: var(--gold); text-wrap: balance; }
  .landed.idle { color: var(--muted); font-family: var(--body); font-size: 15px; font-weight: 600; }
  .landed.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .rerolls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; color: var(--muted); font-size: 14px; }
  .tokens { font-family: var(--label); font-size: 15px; letter-spacing: .06em; color: var(--fg); }

  .card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .card.complete { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 20px 60px rgba(234,181,77,.22); }
  .card-head { display: flex; flex-direction: column; gap: 4px; }
  .card-head h2 { margin: 0; font-family: var(--display); font-size: clamp(24px, 4vw, 32px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  .traits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .trait { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 8px; border-top: 1px solid var(--line); border-radius: 6px; }
  .trait:first-child { border-top: none; }
  .trait.current { background: var(--gold-soft); }
  .trait .k { font-family: var(--label); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-size: 14px; }
  .trait .v { font-weight: 700; overflow-wrap: anywhere; }
  .trait .v.empty { color: var(--line); font-family: var(--display); }
  .trait .v.fresh { animation: pop .45s cubic-bezier(.2,1.6,.4,1); display: inline-block; }
  .card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .note { color: var(--muted); font-size: 13px; }

  .editor { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 18px; }
  .editor summary { cursor: pointer; padding: 14px 0; font-family: var(--display); font-weight: 600; font-size: 18px; }
  .editor-body { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 18px; padding-bottom: 18px; }
  @media (max-width: 640px) { .editor-body { grid-template-columns: minmax(0, 1fr); } }
  .wheel-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .wheel-list button { width: 100%; text-align: left; border-radius: 8px; padding: 8px 12px; background: transparent; color: var(--fg); font-weight: 600; border: 1px solid transparent; display: flex; justify-content: space-between; gap: 8px; }
  .wheel-list button[aria-current="true"] { background: var(--panel-2); border-color: var(--gold); }
  .wheel-list .count { color: var(--muted); font-family: var(--label); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .edit-form { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .error { color: var(--rose); font-size: 13px; min-height: 1.2em; margin: 0; }

  .history h3 { margin: 0 0 10px; font-family: var(--display); font-size: 18px; }
  .history ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
  .history li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .history strong { font-family: var(--display); display: block; }
  .history span { color: var(--muted); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    .pointer.tick, .landed.pop, .trait .v.fresh { animation: none; }
  }
</style>

<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">Spin the wheels, accept your fate</p>
      <h1>Wheel of Faith</h1>
    </div>
    <div class="top-controls">
      <label for="preset">Theme</label>
      <select id="preset"></select>
      <button id="mute" class="ghost small" aria-pressed="false">Sound on</button>
    </div>
  </header>

  <main class="stage">
    <section class="wheel-col" aria-label="Wheel">
      <p class="wheel-label"><span id="catName">Race</span><span id="catStep" class="step"></span></p>
      <div class="wheel-wrap">
        <div class="pointer" id="pointer"></div>
        <canvas id="wheel" role="img" aria-label="Spinning wheel"></canvas>
      </div>
      <p class="landed idle" id="landed" aria-live="polite">Press Spin to roll your first trait</p>
      <div class="actions">
        <button id="spin" class="primary">Spin</button>
        <button id="spinAll" class="secondary">Spin all</button>
        <button id="newChar" class="ghost">New character</button>
      </div>
      <div class="rerolls">
        <span class="tokens" id="rerollInfo"></span>
        <label for="rerollLimit">Allowed per character</label>
        <select id="rerollLimit">
          <option value="0">None</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="99">Unlimited</option>
        </select>
      </div>
    </section>

    <section class="card" id="card" aria-label="Character sheet">
      <div class="card-head">
        <p class="eyebrow">Character sheet</p>
        <h2 id="charName"></h2>
        <div><button id="rename" class="link">Roll a new name</button></div>
      </div>
      <ul class="traits" id="traits"></ul>
      <div class="card-foot">
        <button id="copy" class="secondary small">Copy character</button>
        <span class="note" id="copyMsg"></span>
      </div>
      <textarea id="copyFallback" readonly hidden aria-label="Character text"></textarea>
    </section>
  </main>

  <details class="editor" id="editor">
    <summary>Edit the wheels</summary>
    <div class="editor-body">
      <div class="field">
        <span class="eyebrow">Wheels in this theme</span>
        <ul class="wheel-list" id="wheelList"></ul>
        <div class="row">
          <button id="addWheel" class="secondary small">Add wheel</button>
          <button id="resetTheme" class="ghost small">Reset theme</button>
        </div>
        <p class="error" id="resetConfirm"></p>
      </div>
      <form class="edit-form" id="editForm">
        <div class="field">
          <label for="wheelName">Wheel name</label>
          <input type="text" id="wheelName" maxlength="24">
        </div>
        <div class="field">
          <label for="wheelOpts">Options, one per line</label>
          <textarea id="wheelOpts"></textarea>
        </div>
        <p class="error" id="editError"></p>
        <div class="row">
          <button type="submit" class="secondary small">Save wheel</button>
          <button type="button" id="deleteWheel" class="ghost small">Delete wheel</button>
          <span class="note">Saving starts a fresh character.</span>
        </div>
      </form>
    </div>
  </details>

  <section class="history" id="historySec" hidden>
    <h3>Past characters</h3>
    <ul id="history"></ul>
  </section>
</div>

<script>
(() => {
  const PRESETS = {
    anime: {
      label: "Shonen anime",
      first: ["Ren", "Kai", "Sora", "Yuki", "Akira", "Hikaru", "Rin", "Haru", "Kaede", "Shion", "Ryo", "Mei", "Itsuki", "Nagi", "Kuro", "Asuka", "Toma", "Yoru"],
      last: ["Kurogane", "Amatsuki", "Shirogami", "Hoshino", "Kagerou", "Tsukishiro", "Raiden", "Yamikawa", "Akatsuki", "Fujimura", "Mikazuki", "Hayabusa"],
      cats: [
        ["Race", ["Human", "Demon", "Half-spirit", "Android", "Dragonkin", "Elf", "Death god", "Beastkin", "Vampire", "Celestial"]],
        ["Power", ["Shadow control", "Time stop", "Blood manipulation", "Gravity", "Copy ability", "Lightning body", "Soul reading", "Ice domain", "Black flames", "Space rifts", "Cursed speech", "Puppet strings"]],
        ["Weapon", ["Katana", "Scythe", "Gauntlets", "Twin daggers", "Chain sickle", "Bow", "Spear", "Talismans", "Greatsword", "Bare fists", "War fan", "Gunblade"]],
        ["Element", ["Fire", "Water", "Wind", "Earth", "Lightning", "Ice", "Light", "Darkness", "Void"]],
        ["Personality", ["Cold and calculating", "Hot-headed", "Cheerful idiot", "Lazy genius", "Tsundere", "Silent type", "Chaotic gremlin", "Noble leader", "Secretly evil", "Battle maniac"]],
        ["Role", ["Main character", "Rival", "Mentor", "Villain", "Anti-hero", "Comic relief", "Side character", "Final boss", "Traitor", "Love interest"]],
        ["Hair", ["Jet black", "Silver", "Crimson", "Spiky blond", "Pastel pink", "Deep blue", "White, black tips", "Green", "Purple"]],
        ["Eyes", ["Gold", "Heterochromia", "Blood red", "Ice blue", "Violet", "Hollow black", "Emerald", "Eyepatch"]],
        ["Rank", ["F", "E", "D", "C", "B", "A", "S", "SS", "SSS"]],
        ["Fate", ["Becomes the strongest", "Dies in arc one", "Gets betrayed", "Loses their power", "Sealed for 1000 years", "Ascends to godhood", "Turns villain", "Retires happily", "Sacrifices for friends", "Returns as a ghost"]]
      ]
    },
    fantasy: {
      label: "Fantasy RPG",
      first: ["Aldric", "Seraphine", "Thorne", "Isolde", "Corvin", "Lyra", "Bram", "Elowen", "Kael", "Maren", "Orrin", "Vesper", "Wren", "Darian"],
      last: ["Ashveil", "Stormborn", "of the Hollow Oak", "Blackthorn", "Dawnbringer", "Grimward", "Silverbrook", "Ironhand", "the Unbound", "Nightbloom"],
      cats: [
        ["Race", ["Human", "Elf", "Dwarf", "Orc", "Halfling", "Tiefling", "Dragonborn", "Gnome", "Fae", "Undead"]],
        ["Class", ["Warrior", "Mage", "Rogue", "Cleric", "Ranger", "Paladin", "Necromancer", "Bard", "Druid", "Warlock"]],
        ["Weapon", ["Longsword", "Staff", "Daggers", "Warhammer", "Longbow", "Halberd", "Crossbow", "Lute", "Tome", "Whip"]],
        ["Magic", ["Pyromancy", "Frost", "Healing", "Illusion", "Summoning", "Blood magic", "Runes", "Storm calling", "Shapeshifting", "None"]],
        ["Background", ["Exiled noble", "Street orphan", "Temple acolyte", "Retired soldier", "Pirate", "Scholar", "Farmhand", "Cult escapee", "Royal guard"]],
        ["Alignment", ["Lawful good", "Neutral good", "Chaotic good", "Lawful neutral", "True neutral", "Chaotic neutral", "Lawful evil", "Neutral evil", "Chaotic evil"]],
        ["Companion", ["Wolf", "Raven", "Tiny dragon", "Talking cat", "Ghost", "Horse", "Mimic", "Owl", "None, a loner"]],
        ["Flaw", ["Greedy", "Reckless", "Cowardly", "Too trusting", "Vengeful", "Arrogant", "Cursed", "Afraid of water"]],
        ["Rank", ["Peasant", "Squire", "Adventurer", "Veteran", "Champion", "Legend", "Mythic"]],
        ["Fate", ["Slays the dragon", "Becomes king", "Lost to the void", "Founds a guild", "Betrayed by the party", "Becomes the dark lord", "Saves the realm", "Dies in a tavern brawl"]]
      ]
    },
    hero: {
      label: "Superhero",
      first: ["Nova", "Jett", "Max", "Riley", "Dana", "Theo", "Sasha", "Leo", "Iris", "Cole", "Zara", "Miles"],
      last: ["Vance", "Storm", "Cross", "Blake", "Rivera", "Okafor", "Chen", "Hale", "Moreau", "Kade"],
      cats: [
        ["Archetype", ["Hero", "Villain", "Anti-hero", "Vigilante", "Sidekick", "Mercenary", "Reformed villain"]],
        ["Power", ["Super strength", "Flight", "Telekinesis", "Super speed", "Invisibility", "Shapeshifting", "Mind control", "Energy blasts", "Healing factor", "Tech genius", "Size shifting", "Duplication"]],
        ["Weakness", ["Loud noises", "Cold", "Their own fear", "Magic", "A rare metal", "Sunlight", "Running out of time", "Their family"]],
        ["Origin", ["Lab accident", "Alien", "Born with it", "Cursed artifact", "Trained for years", "Experiment escapee", "Rich and bored", "Struck by lightning"]],
        ["Costume", ["Black and red", "Blue and gold", "All white", "Green and purple", "Silver armor", "Street clothes and a mask", "Neon"]],
        ["Base", ["Underground bunker", "Floating sky fortress", "Abandoned subway", "Penthouse", "Moon base", "Their mom's garage"]],
        ["Nemesis", ["Evil twin", "Former mentor", "Shadow government", "Alien warlord", "Mad scientist", "Their best friend"]],
        ["Rank", ["Street level", "City level", "Country level", "Planet level", "Cosmic"]],
        ["Fate", ["Saves the world", "Dies and comes back", "Hangs up the cape", "Becomes the villain", "Leads a team", "Unmasked on live TV"]]
      ]
    }
  };

  const SEG_COLORS = ["#5b3fa8", "#c2416b", "#2b7d9c", "#c9822a", "#3c8a58", "#8b3fa1", "#b0502f", "#2f5cb0"];
  const STORE_KEY = "wheel-of-faith.v1";
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = (id) => document.getElementById(id);
  const els = {
    preset: $("preset"), mute: $("mute"), catName: $("catName"), catStep: $("catStep"), canvas: $("wheel"), pointer: $("pointer"),
    landed: $("landed"), spin: $("spin"), spinAll: $("spinAll"), newChar: $("newChar"), rerollInfo: $("rerollInfo"), rerollLimit: $("rerollLimit"),
    card: $("card"), charName: $("charName"), rename: $("rename"), traits: $("traits"), copy: $("copy"), copyMsg: $("copyMsg"), copyFallback: $("copyFallback"),
    wheelList: $("wheelList"), addWheel: $("addWheel"), resetTheme: $("resetTheme"), resetConfirm: $("resetConfirm"), editForm: $("editForm"),
    wheelName: $("wheelName"), wheelOpts: $("wheelOpts"), editError: $("editError"), deleteWheel: $("deleteWheel"),
    historySec: $("historySec"), history: $("history")
  };

  // ---------- state ----------
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } })();
  const state = {
    preset: PRESETS[saved.preset] ? saved.preset : "anime",
    custom: saved.custom || {},
    rerollLimit: saved.rerollLimit != null ? saved.rerollLimit : 1,
    history: Array.isArray(saved.history) ? saved.history : [],
    muted: !!saved.muted,
    results: [],
    fresh: -1,
    rerollsUsed: 0,
    name: "",
    wheelCat: 0,
    winner: -1,
    rotation: 0,
    spinning: false,
    editIdx: 0
  };

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        preset: state.preset, custom: state.custom, rerollLimit: state.rerollLimit, history: state.history.slice(0, 12), muted: state.muted
      }));
    } catch (e) { /* storage unavailable: app still works for this visit */ }
  }

  function cats() {
    const c = state.custom[state.preset];
    if (Array.isArray(c) && c.length) return c;
    return PRESETS[state.preset].cats.map(([name, opts]) => ({ name, opts: opts.slice() }));
  }

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const rollName = () => { const p = PRESETS[state.preset]; return pick(p.first) + " " + pick(p.last); };
  const nextEmpty = () => state.results.findIndex((r) => r == null);
  const isComplete = () => state.results.length > 0 && nextEmpty() === -1;
  const rerollsLeft = () => Math.max(0, state.rerollLimit - state.rerollsUsed);

  function newCharacter() {
    if (isComplete()) {
      state.history.unshift({ name: state.name, theme: PRESETS[state.preset].label, traits: cats().map((c, i) => [c.name, state.results[i]]) });
      state.history = state.history.slice(0, 12);
      persist();
    }
    state.results = new Array(cats().length).fill(null);
    state.rerollsUsed = 0;
    state.fresh = -1;
    state.name = rollName();
    state.wheelCat = 0;
    state.winner = -1;
    setLanded(null);
    render();
  }

  // ---------- sound ----------
  let audio = null;
  function tickSound() {
    if (state.muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(1500, t);
      o.frequency.exponentialRampToValueAtTime(600, t + 0.03);
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.05);
    } catch (e) { /* no audio available */ }
  }
  function chime() {
    if (state.muted || !audio) return;
    const t = audio.currentTime;
    [660, 880, 1320].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.07, t + i * 0.07 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.07 + 0.5);
      o.connect(g).connect(audio.destination);
      o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.55);
    });
  }

  // ---------- wheel drawing ----------
  const ctx = els.canvas.getContext("2d");
  const TAU = Math.PI * 2;
  const POINTER = -Math.PI / 2;

  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  }

  function drawWheel() {
    const size = els.canvas.clientWidth;
    if (!size) return;
    const dpr = window.devicePixelRatio || 1;
    if (els.canvas.width !== Math.round(size * dpr)) {
      els.canvas.width = Math.round(size * dpr);
      els.canvas.height = Math.round(size * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    const opts = cats()[state.wheelCat].opts;
    const n = opts.length;
    const c = size / 2, R = c - 8, a = TAU / n;
    const fs = Math.max(10, Math.min(R * 0.075, R * 0.62 * a * 0.6));

    for (let i = 0; i < n; i++) {
      const s = state.rotation + i * a;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, R, s, s + a);
      ctx.closePath();
      let col = i % SEG_COLORS.length;
      if (i === n - 1 && col === 0 && n > 1) col = 3; // keep last and first segments from matching
      ctx.fillStyle = SEG_COLORS[col];
      ctx.fill();
      if (i === state.winner) { ctx.fillStyle = "rgba(255,240,200,0.28)"; ctx.fill(); }
      ctx.strokeStyle = "#130f26";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(s + a / 2);
      ctx.fillStyle = "#fff8ec";
      ctx.font = `700 ${fs}px Figtree, "Segoe UI", sans-serif`;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = 3;
      ctx.fillText(fitText(opts[i], R * 0.66), R - 16, 0);
      ctx.restore();
    }

    // rim and pegs
    ctx.beginPath();
    ctx.arc(c, c, R, 0, TAU);
    ctx.strokeStyle = "#eab54d";
    ctx.lineWidth = 5;
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      const ang = state.rotation + i * a;
      ctx.beginPath();
      ctx.arc(c + Math.cos(ang) * (R - 1), c + Math.sin(ang) * (R - 1), Math.max(2.5, R * 0.018), 0, TAU);
      ctx.fillStyle = "#fff1cf";
      ctx.fill();
    }

    // hub
    const hr = R * 0.15;
    ctx.beginPath();
    ctx.arc(c, c, hr, 0, TAU);
    ctx.fillStyle = "#130f26";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#eab54d";
    ctx.stroke();
    ctx.fillStyle = "#eab54d";
    ctx.font = `800 ${Math.max(10, hr * 0.42)}px Cinzel, Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("FAITH", c, c + 1);
  }

  const segmentUnderPointer = (n) => {
    const a = TAU / n;
    const rel = (((POINTER - state.rotation) % TAU) + TAU) % TAU;
    return Math.floor(rel / a) % n;
  };

  function spinWheel(catIdx) {
    return new Promise((resolve) => {
      state.spinning = true;
      state.wheelCat = catIdx;
      state.winner = -1;
      render();
      const opts = cats()[catIdx].opts;
      const n = opts.length;
      const a = TAU / n;
      const choice = Math.floor(Math.random() * n);
      const jitter = (Math.random() - 0.5) * a * 0.7;
      const target = POINTER - (choice + 0.5) * a + jitter;
      const delta = (((target - state.rotation) % TAU) + TAU) % TAU;
      const turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 3);
      const start = state.rotation;
      const end = start + turns * TAU + delta;
      const dur = reduceMotion ? 700 : 3800 + Math.random() * 900;
      const t0 = performance.now();
      let lastSeg = segmentUnderPointer(n);

      const frame = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - t, 4);
        state.rotation = start + (end - start) * e;
        const seg = segmentUnderPointer(n);
        if (seg !== lastSeg) {
          lastSeg = seg;
          tickSound();
          els.pointer.classList.remove("tick");
          void els.pointer.offsetWidth;
          els.pointer.classList.add("tick");
        }
        drawWheel();
        if (t < 1) { requestAnimationFrame(frame); return; }
        state.rotation = end % TAU;
        state.winner = segmentUnderPointer(n);
        state.spinning = false;
        drawWheel();
        resolve(opts[state.winner]);
      };
      requestAnimationFrame(frame);
    });
  }

  // ---------- actions ----------
  function setLanded(text) {
    els.landed.classList.remove("pop");
    if (text == null) {
      els.landed.classList.add("idle");
      els.landed.textContent = isComplete() ? "Your character is complete" : "Press Spin to roll your first trait";
      return;
    }
    els.landed.classList.remove("idle");
    els.landed.textContent = text;
    void els.landed.offsetWidth;
    els.landed.classList.add("pop");
  }

  async function spinNext() {
    const idx = nextEmpty();
    if (idx === -1 || state.spinning) return;
    const value = await spinWheel(idx);
    state.results[idx] = value;
    state.fresh = idx;
    setLanded(value);
    if (isComplete()) { chime(); }
    render();
  }

  async function spinAll() {
    if (state.spinning) return;
    els.spinAll.dataset.running = "1";
    while (nextEmpty() !== -1) {
      await spinNext();
      if (nextEmpty() !== -1) await new Promise((r) => setTimeout(r, reduceMotion ? 250 : 700));
    }
    delete els.spinAll.dataset.running;
    render();
  }

  async function reroll(idx) {
    if (state.spinning || rerollsLeft() <= 0 || state.results[idx] == null) return;
    state.rerollsUsed++;
    const value = await spinWheel(idx);
    state.results[idx] = value;
    state.fresh = idx;
    setLanded(value);
    render();
  }

  function characterText() {
    const lines = [state.name];
    cats().forEach((c, i) => lines.push(`${c.name}: ${state.results[i] == null ? "?" : state.results[i]}`));
    lines.push("", "Rolled on Wheel of Faith");
    return lines.join("\n");
  }

  // ---------- render ----------
  function render() {
    const cs = cats();
    if (state.results.length !== cs.length) state.results = new Array(cs.length).fill(null);
    if (state.wheelCat >= cs.length) state.wheelCat = 0;
    const busy = state.spinning || !!els.spinAll.dataset.running;
    const next = nextEmpty();
    if (!busy && next !== -1 && state.winner === -1) state.wheelCat = next;

    els.catName.textContent = cs[state.wheelCat].name;
    els.catStep.textContent = `${state.wheelCat + 1} / ${cs.length}`;
    els.canvas.setAttribute("aria-label", `Wheel for ${cs[state.wheelCat].name}: ${cs[state.wheelCat].opts.join(", ")}`);

    els.spin.disabled = busy || next === -1;
    els.spin.textContent = next === -1 ? "Done" : "Spin";
    els.spinAll.disabled = busy || next === -1;
    els.newChar.disabled = busy;
    els.rename.disabled = busy;
    els.preset.disabled = busy;
    els.rerollLimit.value = String(state.rerollLimit);
    els.rerollLimit.disabled = busy;
    els.rerollInfo.textContent = state.rerollLimit === 0 ? "No rerolls" : state.rerollLimit >= 99 ? "Unlimited rerolls" : `Rerolls left: ${rerollsLeft()} of ${state.rerollLimit}`;

    els.charName.textContent = state.name;
    els.card.classList.toggle("complete", isComplete());
    els.traits.innerHTML = "";
    cs.forEach((c, i) => {
      const li = document.createElement("li");
      li.className = "trait" + (i === state.wheelCat && (busy || next !== -1) ? " current" : "");
      const k = document.createElement("span"); k.className = "k"; k.textContent = c.name;
      const v = document.createElement("span");
      const val = state.results[i];
      v.className = "v" + (val == null ? " empty" : "") + (i === state.fresh ? " fresh" : "");
      v.textContent = val == null ? "?" : val;
      li.append(k, v);
      if (val != null && state.rerollLimit > 0) {
        const b = document.createElement("button");
        b.className = "link";
        b.textContent = "Reroll";
        b.disabled = busy || rerollsLeft() <= 0;
        b.setAttribute("aria-label", `Reroll ${c.name}`);
        b.addEventListener("click", () => reroll(i));
        li.append(b);
      } else {
        li.append(document.createElement("span"));
      }
      els.traits.append(li);
    });
    state.fresh = -1;
    els.copy.disabled = busy;

    renderEditor();
    renderHistory();
    drawWheel();
  }

  function renderEditor() {
    const cs = cats();
    if (state.editIdx >= cs.length) state.editIdx = cs.length - 1;
    els.wheelList.innerHTML = "";
    cs.forEach((c, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-current", i === state.editIdx ? "true" : "false");
      const nm = document.createElement("span"); nm.textContent = c.name;
      const ct = document.createElement("span"); ct.className = "count"; ct.textContent = c.opts.length;
      b.append(nm, ct);
      b.addEventListener("click", () => { state.editIdx = i; els.editError.textContent = ""; fillEditForm(); renderEditor(); });
      li.append(b);
      els.wheelList.append(li);
    });
    els.deleteWheel.disabled = cs.length <= 1;
  }

  function fillEditForm() {
    const c = cats()[state.editIdx];
    els.wheelName.value = c.name;
    els.wheelOpts.value = c.opts.join("\n");
  }

  function renderHistory() {
    els.historySec.hidden = state.history.length === 0;
    els.history.innerHTML = "";
    state.history.forEach((h) => {
      const li = document.createElement("li");
      const s = document.createElement("strong"); s.textContent = h.name;
      const sp = document.createElement("span");
      sp.textContent = h.traits.slice(0, 4).map((t) => t[1]).join(" · ");
      li.append(s, sp);
      els.history.append(li);
    });
  }

  function commitCats(cs) {
    state.custom[state.preset] = cs;
    persist();
    state.results = new Array(cs.length).fill(null);
    state.rerollsUsed = 0;
    state.wheelCat = 0;
    state.winner = -1;
    setLanded(null);
    render();
  }

  // ---------- events ----------
  Object.entries(PRESETS).forEach(([k, p]) => {
    const o = document.createElement("option");
    o.value = k; o.textContent = p.label;
    els.preset.append(o);
  });
  els.preset.value = state.preset;
  els.preset.addEventListener("change", () => {
    state.preset = els.preset.value;
    state.results = [];
    state.editIdx = 0;
    persist();
    newCharacter();
    fillEditForm();
  });

  els.mute.addEventListener("click", () => {
    state.muted = !state.muted;
    els.mute.textContent = state.muted ? "Sound off" : "Sound on";
    els.mute.setAttribute("aria-pressed", String(state.muted));
    persist();
  });
  els.mute.textContent = state.muted ? "Sound off" : "Sound on";
  els.mute.setAttribute("aria-pressed", String(state.muted));

  els.spin.addEventListener("click", () => { state.winner = -1; spinNext(); });
  els.spinAll.addEventListener("click", spinAll);
  els.newChar.addEventListener("click", newCharacter);
  els.rename.addEventListener("click", () => { state.name = rollName(); render(); });
  els.rerollLimit.addEventListener("change", () => { state.rerollLimit = Number(els.rerollLimit.value); persist(); render(); });

  els.copy.addEventListener("click", () => {
    const text = characterText();
    const done = () => { els.copyMsg.textContent = "Copied"; setTimeout(() => (els.copyMsg.textContent = ""), 1800); };
    const fallback = () => {
      els.copyFallback.hidden = false;
      els.copyFallback.value = text;
      els.copyFallback.focus();
      els.copyFallback.select();
      els.copyMsg.textContent = "Select and copy the text below";
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  });

  els.editForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const name = els.wheelName.value.trim();
    const opts = els.wheelOpts.value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (!name) { els.editError.textContent = "Give the wheel a name."; return; }
    if (opts.length < 2) { els.editError.textContent = "A wheel needs at least 2 options."; return; }
    if (opts.length > 40) { els.editError.textContent = "Keep it to 40 options or fewer so the labels stay readable."; return; }
    els.editError.textContent = "";
    const cs = cats().map((c) => ({ name: c.name, opts: c.opts.slice() }));
    cs[state.editIdx] = { name, opts };
    commitCats(cs);
  });

  els.addWheel.addEventListener("click", () => {
    const cs = cats().map((c) => ({ name: c.name, opts: c.opts.slice() }));
    cs.push({ name: "New wheel", opts: ["Option one", "Option two", "Option three"] });
    state.editIdx = cs.length - 1;
    commitCats(cs);
    fillEditForm();
    els.wheelName.focus();
    els.wheelName.select();
  });

  els.deleteWheel.addEventListener("click", () => {
    const cs = cats().map((c) => ({ name: c.name, opts: c.opts.slice() }));
    if (cs.length <= 1) return;
    cs.splice(state.editIdx, 1);
    state.editIdx = Math.max(0, state.editIdx - 1);
    commitCats(cs);
    fillEditForm();
  });

  let resetArmed = false;
  els.resetTheme.addEventListener("click", () => {
    if (!resetArmed) {
      resetArmed = true;
      els.resetTheme.textContent = "Confirm reset";
      els.resetConfirm.textContent = "This restores the original wheels for this theme.";
      setTimeout(() => { resetArmed = false; els.resetTheme.textContent = "Reset theme"; els.resetConfirm.textContent = ""; }, 4000);
      return;
    }
    resetArmed = false;
    els.resetTheme.textContent = "Reset theme";
    els.resetConfirm.textContent = "";
    delete state.custom[state.preset];
    state.editIdx = 0;
    commitCats(cats());
    delete state.custom[state.preset];
    persist();
    fillEditForm();
  });

  if (window.ResizeObserver) new ResizeObserver(drawWheel).observe(els.canvas);
  else window.addEventListener("resize", drawWheel);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel);

  newCharacter();
  fillEditForm();
})();
</script>
</body>
</html>
